name: quantixlab-maps

services:
  gateway:
    image: ${GATEWAY_IMAGE:?set a digest-pinned gateway image}
    env_file: ${MAPS_ENV_FILE:-/etc/quantixlab-maps/maps.env}
    volumes:
      - ${MAP_CURRENT_DIR:?set MAP_CURRENT_DIR}:/srv/quantixlab-maps/current:ro
      - ${PROJECTS_FILE:?set PROJECTS_FILE}:/etc/quantixlab-maps/projects.json:ro
    ports: ["127.0.0.1:${OPERATOR_PORT:-8080}:8080"]
    depends_on:
      valkey: { condition: service_healthy }
      photon: { condition: service_healthy }
      valhalla: { condition: service_healthy }
      martin: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/health/live').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal, consumers]

  martin:
    image: ${MARTIN_IMAGE:?set a tested digest-pinned Martin image}
    command: [/data/tiles]
    volumes: ["${MAP_CURRENT_DIR}/tiles:/data/tiles:ro"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3000/catalog]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  valhalla:
    image: ${VALHALLA_IMAGE:?set a digest-pinned Valhalla 3.8.0 image}
    environment: { use_tiles_ignore_pbf: "True", force_rebuild: "False", server_threads: "${VALHALLA_THREADS:-6}" }
    volumes: ["${MAP_CURRENT_DIR}/valhalla:/custom_files"]
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4.0
    pids_limit: 512
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8002/status]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [internal]

  photon:
    image: ${PHOTON_IMAGE:?set a digest-pinned Photon image}
    volumes: ["${MAP_CURRENT_DIR}/photon:/data"]
    restart: unless-stopped
    mem_limit: 8g
    cpus: 3.0
    pids_limit: 512
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:2322/status]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [internal]

  valkey:
    image: ${VALKEY_IMAGE:?set a digest-pinned Valkey image}
    command: [valkey-server, /etc/valkey/valkey.conf]
    volumes:
      - ./maps/valkey.conf:/etc/valkey/valkey.conf:ro
      - ${VALKEY_ACL_FILE:?set VALKEY_ACL_FILE}:/etc/valkey/users.acl:ro
      - valkey-data:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=\"$$VALKEY_HEALTH_PASSWORD\" valkey-cli --user health ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment: { VALKEY_HEALTH_PASSWORD: "${VALKEY_HEALTH_PASSWORD:?set health ACL password}" }
    networks: [internal]

  caddy:
    image: ${CADDY_IMAGE:?set a digest-pinned Caddy 2.10.2 image}
    environment: { MAP_DOMAIN: "${MAP_DOMAIN:-maps.quantixlab.dev}", MAP_COMPAT_DOMAIN: "${MAP_COMPAT_DOMAIN:-tourbond-maps.quantixlab.dev}" }
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443", "443:443/udp"]
    depends_on: { gateway: { condition: service_healthy } }
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:2019/config/]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal, edge]

networks:
  internal: { internal: true }
  edge: {}
  consumers: { name: quantixlab-maps-consumers }
volumes: { valkey-data: {}, caddy-data: {}, caddy-config: {} }
