name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run openapi:check
      - run: npm run sdk:check
      - run: npm audit --audit-level=high
      - run: npm run build
  dart-client:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: packages/dart-client } }
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get
      - run: dart analyze
  container-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          -e MAP_DOMAIN=maps.quantixlab.dev
          -e MAP_COMPAT_DOMAIN=maps.tourbond.quantixlab.dev
          -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          caddy validate --config /etc/caddy/Caddyfile
      - run: >-
          docker build
          --build-arg NODE_IMAGE=node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          -t qlm-gateway:test .
      - run: >-
          docker build
          --build-arg JAVA_BUILD_IMAGE=eclipse-temurin:21-jdk-jammy@sha256:d48e921b83506f58910295b35fd02978c7f4c57fef41bceee6a460d7d97bc251
          --build-arg JAVA_IMAGE=eclipse-temurin:21-jre-jammy@sha256:54b382c9d790d3201004d4e3921f4eff7dc7d67e1ce21a2da8d8faaaf63c85fc
          -f deploy/maps/photon.Dockerfile -t qlm-photon:test .
  miniature-bangladesh:
    if: ${{ vars.MINI_DATASET_READY == 'true' }}
    runs-on: [self-hosted, linux, maps-mini-dataset]
    steps:
      - uses: actions/checkout@v4
      - run: tests/integration/mini-bangladesh.sh
